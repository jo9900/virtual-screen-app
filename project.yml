name: VirtualScreen
options:
  bundleIdPrefix: io.github.jo9900
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  VirtualScreenCore:
    path: Packages/VirtualScreenCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 54BTJHJKUU
targets:
  VirtualScreen:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: VirtualScreenCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Virtual Screen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/VirtualScreen.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: Virtual Screen
        PRODUCT_MODULE_NAME: VirtualScreen
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jo9900.VirtualScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
